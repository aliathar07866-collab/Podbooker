<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Scan: Tumhari Energy Kitni Hai?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{--bg:#07060f;--fg:#f4f1ff;--mut:#9a94c4;--line:#2a2650;--inp:#12102a;--a:#b86bff;--b:#38e8ff;--c:#ff5fa2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ff;--fg:#17112e;--mut:#6a6490;--line:#d9d1ff;--inp:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#07060f;--fg:#f4f1ff;--mut:#9a94c4;--line:#2a2650;--inp:#12102a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:460px;margin:0 auto;padding:28px 20px 48px}
h1{font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.95;letter-spacing:-.03em;margin:8px 0 14px}
h1 span{background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--mut);margin:0 0 24px}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--inp);color:var(--fg);font:inherit;font-size:17px}
input:focus-visible,button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.btn{display:block;width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;font:800 18px "Bricolage Grotesque",system-ui,sans-serif;color:#07060f;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);margin-top:12px}
.hide{display:none!important}
#scan{text-align:center;padding-top:40px}
#scan canvas{width:260px;height:260px;max-width:80vw}
#scanmsg{font-weight:800;font-size:20px;margin-top:10px}
.bar{height:6px;border-radius:6px;background:var(--line);margin:18px auto 0;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c));transition:width 2.6s linear}
.card{background:radial-gradient(120% 80% at 50% 0%,#241a52 0%,#0d0a22 60%);color:#f4f1ff;border-radius:28px;padding:26px 22px 22px;border:1.5px solid #3a3372;text-align:center}
.card .who{color:#b6b0e0;font-size:15px}
.card h2{font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 6px}
.card canvas{width:240px;height:240px;max-width:70vw;margin:6px auto 0;display:block}
.pts{font-weight:800;font-size:44px;letter-spacing:-.03em;color:#38e8ff;line-height:1}
.pts small{display:block;font-size:13px;font-weight:500;color:#b6b0e0;letter-spacing:0;margin-top:4px}
.stats{margin:18px 0 6px;text-align:left}
.row{display:grid;grid-template-columns:62px 1fr 30px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.row u{display:block;height:8px;border-radius:8px;background:#2a2650;text-decoration:none;overflow:hidden}
.row u i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#b86bff,#ff5fa2)}
.roast{font-size:17px;margin:16px 0 4px;color:#f4f1ff}
.foot{font-size:12px;color:#8d86bb;margin-top:14px}
#cmp{margin-top:22px;border-top:1.5px solid var(--line);padding-top:6px}
#cres{text-align:center;margin-top:18px}
#cres b{display:block;font-weight:800;font-size:64px;line-height:1;letter-spacing:-.04em;background:linear-gradient(90deg,var(--c),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tip{color:var(--mut);font-size:14px;text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>Tumhara <span>aura</span> kitna hai?</h1>
  <p class="sub">Naam likho. 3 second mein pata chalega tum kis type ke insaan ho, aur tumhara aura kitna strong hai. Phir dost ke saath compare karo.</p>
  <label for="nm">Tumhara naam</label>
  <input id="nm" maxlength="24" autocomplete="off" placeholder="Jaise: Ali">
  <label for="dob">Date of birth (optional, result aur accurate hoga)</label>
  <input id="dob" type="date">
  <button class="btn" id="go">Aura scan karo</button>
</section>

<section id="scan" class="hide" aria-live="polite">
  <canvas id="c1" width="520" height="520"></canvas>
  <div id="scanmsg"></div>
  <div class="bar"><i id="fill"></i></div>
</section>

<section id="res" class="hide">
  <div class="card" id="card">
    <div class="who" id="rwho"></div>
    <h2 id="rtitle"></h2>
    <canvas id="c2" width="480" height="480"></canvas>
    <div class="pts"><span id="rpts"></span><small>aura points</small></div>
    <div class="stats" id="rstats"></div>
    <p class="roast" id="rroast"></p>
    <div class="foot">Apna aura scan karo, dost se compare karo</div>
  </div>
  <p class="tip">Screenshot lo aur story pe laga do.</p>
  <button class="btn" id="share">Dost ko bhejo</button>
  <div id="cmp">
    <label for="fn">Dost ka naam</label>
    <input id="fn" maxlength="24" autocomplete="off" placeholder="Dost ka naam likho">
    <button class="btn ghost" id="cbtn">Aura compare karo</button>
    <div id="cres" class="hide"></div>
  </div>
  <button class="btn ghost" id="again">Dobara scan karo</button>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
function hash(str){let x=1779033703^str.length;for(let i=0;i<str.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x<<13|x>>>19}x=Math.imul(x^x>>>16,2246822507);x=Math.imul(x^x>>>13,3266489909);return(x^x>>>16)>>>0}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TYPES=[
["Raat 3 baje ka Overthinker","Tumhara dimagh raat ko Wi-Fi se zyada active hota hai."],
["Silent Main Character","Bolte kam ho, lekin entry maro to background music khud baj jata hai."],
["Chai-Powered Legend","Tumhari energy ka source chai hai, motivation sirf bahana hai."],
["Seen-Zone Sultan","Message parh lete ho, jawab dene ka mood kal ka plan hai."],
["Last Bench Genius","Padhai kam, ideas itne ke Elon ko DM karna chahiye."],
["Pocket Sigma","Sab sochte hain tum shant ho, andar 47 tabs khule hain."],
["Meme-Lord Royalty","Tumhari hansi dekh kar logon ko bina wajah hansi aa jati hai."],
["Plot-Twist Person","Jis din tum serious ho jao, poori dunya ko shak ho jata hai."]
];
const STATS=["Aura","Rizz","Chaos","Dimagh","Sabr"];
let raf=0;
function orb(cv,seed){
  cancelAnimationFrame(raf);
  const x=cv.getContext("2d"),W=cv.width,R=rng(seed),hue=seed%360;
  const bl=Array.from({length:7},(_,i)=>({r:.18+R()*.18,o:.1+R()*.28,s:(R()*.8+.3)*(R()<.5?-1:1),p:R()*6.28,h:hue+i*(25+R()*30)}));
  const dots=Array.from({length:60},()=>({a:R()*6.28,d:.36+R()*.12,s:R()*.6+.2,z:R()*2+.8}));
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function draw(t){
    x.clearRect(0,0,W,W);x.globalCompositeOperation="source-over";
    x.save();x.beginPath();x.arc(W/2,W/2,W*.34,0,6.28);x.clip();
    x.fillStyle="#0a0720";x.fillRect(0,0,W,W);x.globalCompositeOperation="lighter";
    bl.forEach(b=>{const a=b.p+t*.0004*b.s,px=W/2+Math.cos(a)*b.o*W,py=W/2+Math.sin(a*1.3)*b.o*W,g=x.createRadialGradient(px,py,0,px,py,b.r*W);
      g.addColorStop(0,"hsla("+b.h+",100%,62%,.95)");g.addColorStop(1,"hsla("+b.h+",100%,50%,0)");x.fillStyle=g;x.fillRect(0,0,W,W)});
    x.restore();x.globalCompositeOperation="lighter";
    x.lineWidth=3;x.strokeStyle="hsla("+(hue+40)+",100%,70%,.55)";x.beginPath();x.arc(W/2,W/2,W*.345,0,6.28);x.stroke();
    dots.forEach(d=>{const a=d.a+t*.0003*d.s,rr=d.d*W+Math.sin(t*.002*d.s+d.a)*6;x.fillStyle="hsla("+(hue+d.a*20)+",100%,75%,.8)";x.beginPath();x.arc(W/2+Math.cos(a)*rr,W/2+Math.sin(a)*rr,d.z,0,6.28);x.fill()});
    if(!still)raf=requestAnimationFrame(draw);
  }
  draw(0);
}
function show(id){["home","scan","res"].forEach(k=>$("#"+k).classList.toggle("hide",k!==id));window.scrollTo(0,0)}
function seedOf(n,d){return hash(n.trim().toLowerCase()+"|"+(d||""))}
let me=null;
function result(name,dob){
  const seed=seedOf(name,dob),R=rng(seed),t=TYPES[seed%TYPES.length];
  const st=STATS.map(()=>30+Math.floor(R()*70));
  const pts=1000+Math.floor(R()*98000);
  me={name,seed,st,pts,t};
  $("#rwho").textContent=name+" ka aura scan";
  $("#rtitle").textContent=t[0];
  $("#rpts").textContent="+"+pts.toLocaleString("en-US");
  $("#rroast").textContent=t[1];
  const box=$("#rstats");box.textContent="";
  STATS.forEach((s,i)=>{const r=document.createElement("div");r.className="row";
    const a=document.createElement("span");a.textContent=s;
    const u=document.createElement("u"),f=document.createElement("i");f.style.width=st[i]+"%";u.appendChild(f);
    const v=document.createElement("span");v.textContent=st[i];r.append(a,u,v);box.appendChild(r)});
  $("#cres").classList.add("hide");$("#fn").value="";
  show("res");orb($("#c2"),seed);
}
const MSG=["Dimagh scan ho raha hai...","Vibes check ho rahi hain...","Aura points ginte ja rahe hain..."];
$("#go").onclick=()=>{
  const n=$("#nm").value.trim();
  if(!n){$("#nm").focus();$("#nm").placeholder="Pehle naam to likho";return}
  show("scan");orb($("#c1"),seedOf(n,$("#dob").value));
  const f=$("#fill");f.style.transition="none";f.style.width="0";void f.offsetWidth;f.style.transition="";f.style.width="100%";
  let i=0;$("#scanmsg").textContent=MSG[0];
  const iv=setInterval(()=>{i++;if(i<MSG.length)$("#scanmsg").textContent=MSG[i]},850);
  setTimeout(()=>{clearInterval(iv);result(n,$("#dob").value)},2700);
};
$("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
$("#again").onclick=()=>{cancelAnimationFrame(raf);$("#nm").value="";show("home")};
$("#cbtn").onclick=()=>{
  const fn=$("#fn").value.trim();if(!fn){$("#fn").focus();return}
  const k=[me.name,fn].map(s=>s.trim().toLowerCase()).sort().join("&");
  const pct=51+hash(k)%49;
  const v=pct>=90?"Tum dono ka aura ek doosre ko complete karta hai.":pct>=75?"Strong vibe match. Saath mein plan banao, kamyabi pakki.":pct>=60?"Theek-thaak match. Chai pe baat karo, sab set ho jayega.":"Aura thoda takra raha hai, magar drama maza dega.";
  const c=$("#cres");c.textContent="";
  const l=document.createElement("div");l.textContent=me.name+" aur "+fn;
  const b=document.createElement("b");b.textContent=pct+"%";
  const p=document.createElement("p");p.textContent=v;
  c.append(l,b,p);c.classList.remove("hide");
};
$("#share").onclick=async()=>{
  const txt="Mera aura scan: "+me.t[0]+", +"+me.pts.toLocaleString("en-US")+" aura points. Tum apna scan karo!";
  try{if(navigator.share){await navigator.share({title:"Aura Scan",text:txt,url:location.href});return}}catch(e){return}
  try{await navigator.clipboard.writeText(txt+" "+location.href);$("#share").textContent="Copy ho gaya"}catch(e){$("#share").textContent="Screenshot le lo"}
};
</script>
</body>
</html>
